[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knot-resolver"
dynamic = ["version"]
description = "Knot Resolver Manager - a Python program that automatically manages the other components of the resolver"
license = { file = "COPYING" }
requires-python = ">=3.9,<4.0"
maintainers = [
    { name = "Knot Resolver team", email = "knot-resolver@labs.nic.cz" },
]
dependencies = [
    "aiohttp",
    "jinja2",
    "pyyaml",
    "supervisor",
    "typing-extensions",
]

[project.optional-dependencies]
prometheus = ["prometheus-client"]
watchdog = ["watchdog"]

[dependency-groups]
all = [
    { include-group = "dev" },
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]
dev = [
    "pyparsing>=3.1.4,<4",
    "poethepoet>=0.24.4,<1",
    "debugpy>=1.8.18,<2",
    "setuptools>=75.3.2",
]
test = [
    "pytest>=8.3.5,<9",
    "pytest-cov>=4.1.0,<5",
    "pytest-asyncio>=0.23.8,<1",
]
lint = [
    "ruff>=0.6.9,<1",
    "mypy>=1.14.1,<2",
    "types-pyyaml>=6.0.12.20241230,<7",
]
docs = [
    "sphinx>=5.3.0,<6",
    "sphinx-rtd-theme>=2.0.0,<3",
    "breathe>=4.35.0,<5",
    # 'imghdr' was removed from a standard library in Python 3.13 (https://peps.python.org/pep-0594/).
    # 'standard-imghdr' is a replacement for missing 'imghdr' module for projects that depend on it.
    # https://pypi.org/project/standard-imghdr/
    "standard-imghdr",
]

[project.urls]
homepage = "https://www.knot-resolver.cz"

[project.scripts]
kresctl = "knot_resolver.client.main:main"
knot-resolver = "knot_resolver.manager.main:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["knot_resolver*"]

[tool.setuptools.package-data]
knot_resolver = [
    "controller/supervisord/*.j2",
    "datamodel/templates/*.j2",
    "datamodel/templates/macros/*.j2",
]

[tool.setuptools.dynamic]
version = {file = "PROJECT_VERSION"}

[tool.poe.executor]
type = "simple"

[tool.poe.tasks]
# Tasks to configure, build and run
configure = { cmd = "scripts/poe-tasks/configure", help = "(Re)configure Meson build directory." }
run = { cmd = "scripts/poe-tasks/run", help = "Run Knot Resolver." }
run-debug = { cmd = "scripts/poe-tasks/run-debug", help = "Debug Knot Resolver with debugpy." }
kresctl = { cmd = "scripts/poe-tasks/kresctl", help="Run kresctl utility" }
docs = { cmd = "scripts/poe-tasks/docs", help = "Build Knot Resolver's HTML documentation." }
# Tasks to generate files
gen-constantspy = { cmd = "scripts/poe-tasks/gen-constantspy", help = "Generate 'constants.py' module using Meson configured options." }
gen-schema = { cmd = "scripts/poe-tasks/gen-schema", help = "Generate a JSON schema of Knot Resolver's declarative configuration."}
gen-setuppy = { cmd = "scripts/poe-tasks/gen-setuppy", help = "Generate 'setup.py' file for backwards compatibility." }
# Tasks to fix, check and test
fix-format = { cmd = "scripts/poe-tasks/fix-format", help = "Check and fix code formatting using Ruff." }
check-code = { cmd = "scripts/poe-tasks/check-code", help = "Check code format, run static code analysis (Ruff) and typing checker (Mypy)." }
check-files = { cmd = "scripts/poe-tasks/check-files", help = "Check that all dependencies are properly installed and generated files are not behind project." }
test-unit = { cmd = "scripts/poe-tasks/test-unit", help = "Run pytest unit tests." }
test-examples = { cmd = "scripts/poe-tasks/test-examples", help = "Validate all configuration examples using 'kresctl validate' utility." }
test-migrate = { cmd = "scripts/poe-tasks/test-migrate", help = "Migrate testing configuration using 'kresctl migrate' utility and validate it." }
# Other tasks
clean = { cmd = "scripts/poe-tasks/clean", help="Cleanup build directories and files." }

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["python"]

[tool.ruff.lint]
extend-select = [
    "A",      # prevent shadowing builtins
    "ARG",    # detect unused function arguments
    "ASYNC",  # async correctness
    "B",      # likely bugs and design issues
    "C4",     # simplify comprehensions
    "DTZ",    # require timezone-aware datetimes
    "EM",     # improve exception messages
    "G",      # validate logging format strings
    "I",      # sort imports
    "ISC",    # detect implicit string concatenation
    "LOG",    # logging best practices
    "N",      # enforce naming conventions
    "PERF",   # performance improvements
    "PIE",    # miscellaneous code improvements
    "PTH",    # prefer pathlib over os.path
    "Q",      # enforce quote consistency
    "RET",    # improve return statement consistency
    "RUF",    # Ruff-specific improvements
    "SIM",    # simplify code
    "TC",     # move type-only imports under TYPE_CHECKING
    "TID",    # import hygiene
    "UP",     # use modern Python syntax
    "W",      # pycodestyle warnings
]
exclude = ["tests/pytests/*"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
mypy_path = ["python"]
python_version = "3.9"
strict = true

# Output
pretty = true
show_error_codes = true
show_column_numbers = true
show_error_context = true

# Extra diagnostics
warn_unused_configs = true
warn_unreachable = true

# Project layout
namespace_packages = true
explicit_package_bases = true

enable_error_code = ["ignore-without-code"]
